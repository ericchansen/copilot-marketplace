name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  editorconfig:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check file formatting against .editorconfig
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EC_VERSION: v4.0.1
        run: npx --yes editorconfig-checker@6.2.0
